version: '3.8'

services:
  fyers-trading-bot:
    build: .
    container_name: fyers_iron_condor_bot
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FYERS_APP_ID=${FYERS_APP_ID}
      - FYERS_SECRET_KEY=${FYERS_SECRET_KEY}
      - FYERS_REDIRECT_URI=${FYERS_REDIRECT_URI}
      - FYERS_PIN=${FYERS_PIN}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
